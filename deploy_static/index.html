<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百人一首 練習ゲーム</title>
<style>
/* ===== リセット & ベース ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #1a1208;
  --bg2:       #221910;
  --gold:      #c9a84c;
  --gold2:     #e8c97a;
  --card-bg:   #fdf6e3;
  --card-border: #c9a84c;
  --text-dark: #1a0e00;
  --text-light:#f5e8c0;
  --radius:    6px;
  --tr:        0.25s ease;
}

html, body {
  height: 100%;
  font-family: 'Hiragino Mincho ProN','Yu Mincho','MS Mincho',serif;
  background: var(--bg);
  color: var(--text-light);
  overflow: hidden;
  user-select: none;
}

/* ===== スクリーン共通 ===== */
.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.4s ease;
}
.screen.hidden { opacity: 0; pointer-events: none; }

/* ===== タイトル画面 ===== */
#title-screen {
  background: radial-gradient(ellipse at center,#2d1e08 0%,#0d0904 100%);
  gap: 32px;
}
.title-logo { text-align: center; }
.title-logo .main {
  font-size: clamp(2rem,5vw,3.5rem);
  color: var(--gold2);
  text-shadow: 0 0 30px rgba(201,168,76,.6);
  letter-spacing: .15em;
}
.title-logo .sub {
  font-size: clamp(.9rem,2vw,1.1rem);
  color: var(--gold); letter-spacing: .3em; margin-top: 8px;
}

.settings-box {
  background: rgba(255,255,255,.05);
  border: 1px solid var(--gold); border-radius: 12px;
  padding: 28px 40px;
  display: flex; flex-direction: column; gap: 20px;
  min-width: 360px; max-width: 480px; width: 90vw;
}
.setting-row {
  display: flex; align-items: center;
  justify-content: space-between; gap: 16px;
}
.setting-label { font-size: 1rem; color: var(--gold); white-space: nowrap; }
.setting-control { display: flex; align-items: center; gap: 8px; }

input[type="range"] {
  -webkit-appearance: none; width: 140px; height: 4px;
  appearance: none;
  background: var(--gold); border-radius: 2px; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px;
  border-radius: 50%; background: var(--gold2); cursor: pointer;
}
.setting-value { min-width: 3.5em; text-align: right; font-size: 1rem; color: var(--gold2); }

.toggle-btn {
  background: var(--bg2); border: 1px solid var(--gold); border-radius: 20px;
  color: var(--gold); padding: 4px 16px; cursor: pointer;
  font-size: .9rem; font-family: inherit; transition: var(--tr);
}
.toggle-btn.on { background: var(--gold); color: var(--bg); font-weight: bold; }

.divider { border: none; border-top: 1px solid rgba(201,168,76,.3); }

.start-btn {
  background: linear-gradient(135deg,#8b6914,#c9a84c,#8b6914);
  border: none; border-radius: 8px;
  color: #1a0e00; font-size: 1.2rem; font-family: inherit; font-weight: bold;
  padding: 14px 48px; cursor: pointer; letter-spacing: .2em;
  transition: var(--tr); box-shadow: 0 4px 20px rgba(201,168,76,.4);
}
.start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(201,168,76,.6); }
.start-btn:active { transform: translateY(0); }
.start-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* ===== ローディング画面 ===== */
#loading-screen { background: var(--bg); gap: 24px; }
.loading-title { font-size: 1.5rem; color: var(--gold); letter-spacing: .2em; }
.loading-bar-wrap {
  width: 320px; height: 12px;
  background: rgba(255,255,255,.1); border-radius: 6px;
  overflow: hidden; border: 1px solid var(--gold);
}
.loading-bar {
  height: 100%;
  background: linear-gradient(90deg,var(--gold),var(--gold2));
  border-radius: 6px; width: 0%; transition: width .25s ease;
}
.loading-status { font-size: .9rem; color: var(--gold); }

/* ===== ゲーム画面 ===== */
#game-screen {
  background: var(--bg);
  flex-direction: column; justify-content: flex-start;
  align-items: stretch;
  padding: 0;
}

/* HUD */
.hud {
  width: 100%; padding: 6px 14px;
  background: var(--bg2); border-bottom: 1px solid rgba(201,168,76,.3);
  display: flex; align-items: center; gap: 14px; flex-shrink: 0; flex-wrap: wrap;
}
.progress-info { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 180px; }
.progress-label { font-size: .78rem; color: var(--gold); white-space: nowrap; }
.progress-bar-wrap {
  flex: 1; height: 8px;
  background: rgba(255,255,255,.1); border-radius: 4px;
  overflow: hidden; border: 1px solid rgba(201,168,76,.4);
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg,var(--gold),var(--gold2));
  border-radius: 4px; width: 0%; transition: width .5s ease;
}
.progress-count { font-size: .82rem; color: var(--gold2); white-space: nowrap; min-width: 4.5em; text-align: right; }

.score-info { display: flex; gap: 14px; align-items: center; }
.score-item { text-align: center; font-size: .72rem; }
.score-item .lbl { color: var(--gold); display: block; }
.score-item .val { color: var(--gold2); font-size: .95rem; font-weight: bold; }

.opp-timer-wrap { display: flex; align-items: center; gap: 6px; }
.opp-label { font-size: .72rem; color: #e06060; white-space: nowrap; }
.opp-bar-wrap {
  width: 72px; height: 8px;
  background: rgba(255,255,255,.1); border-radius: 4px;
  overflow: hidden; border: 1px solid rgba(200,60,60,.4);
}
.opp-bar {
  height: 100%;
  background: linear-gradient(90deg,#8b1a1a,#e06060);
  border-radius: 4px; width: 100%; transition: width .1s linear;
}

/* 上の句エリア */
.kami-area {
  width: 100%; padding: 8px 20px;
  background: rgba(201,168,76,.05);
  border-bottom: 1px solid rgba(201,168,76,.2);
  text-align: center; flex-shrink: 0;
}
.kami-text {
  font-size: clamp(.95rem,2.2vw,1.35rem);
  color: var(--gold2); letter-spacing: .12em;
  min-height: 1.6em; line-height: 1.6; transition: opacity .3s;
}
.kami-state { font-size: .72rem; color: var(--gold); margin-top: 2px; letter-spacing: .1em; }

/* カードエリア */
.card-area { flex: 1; width: 100%; overflow: hidden; position: relative; padding: 6px; }
.card-grid {
  display: grid; gap: 5px;
  width: 100%;
  align-content: start;
  justify-content: center;
}

.card-slot {
  width: 100%;
  height: 100%;
}

/* 各カード */
.card {
  background: var(--card-bg);
  border: 2px solid var(--card-border); border-radius: var(--radius);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 6px 4px; cursor: pointer;
  transition: transform var(--tr), box-shadow var(--tr);
  position: relative; overflow: hidden;
  width: 100%;
  height: 100%;
}

.card-blank {
  width: 100%;
  height: 100%;
  border-radius: var(--radius);
  background: transparent;
  pointer-events: none;
}
.card:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 6px 18px rgba(201,168,76,.45);
  border-color: var(--gold2);
}
.card:active { transform: scale(.97); }
.card-text {
  font-size: var(--card-font-size, 16px);
  color: var(--text-dark);
  writing-mode: vertical-rl; text-orientation: mixed;
  line-height: var(--card-line-height, 1.62);
  letter-spacing: var(--card-letter-spacing, .14em);
  text-align: center; max-height: 100%; overflow: hidden;
  margin-top: var(--card-text-top-margin, 6px);
  pointer-events: none; white-space: pre-line;
}

/* カードアニメーション */
.card.correct  { animation: aCorrect  .6s ease forwards; pointer-events: none; }
.card.wrong    { animation: aWrong    .5s ease; }
.card.taken    { animation: aTaken    .55s ease forwards; pointer-events: none; }
.card.removing { animation: aRemove   .35s ease forwards; pointer-events: none; }
.card.appear   { animation: aAppear   .3s ease backwards; }

@keyframes aCorrect {
  0%   { background:var(--card-bg); transform:scale(1); }
  35%  { background:#a8f0a8; transform:scale(1.1); box-shadow:0 0 22px rgba(40,200,40,.7); }
  100% { background:#a8f0a8; opacity:0; transform:scale(1); }
}
@keyframes aWrong {
  0%,100% { transform:translateX(0); background:var(--card-bg); }
  20%      { transform:translateX(-6px); background:#f0a8a8; }
  50%      { transform:translateX(6px);  background:#f0a8a8; }
  80%      { transform:translateX(-3px); }
}
@keyframes aTaken {
  0%   { opacity:1; transform:scale(1); background:var(--card-bg); }
  30%  { background:#f0d0a0; transform:scale(.9); }
  100% { opacity:0; transform:scale(.7) translateY(-8px); }
}
@keyframes aRemove {
  0%   { opacity:1; transform:scale(1); }
  100% { opacity:0; transform:scale(.5); }
}
@keyframes aAppear {
  0%   { opacity:0; transform:scale(.6) translateY(8px); }
  100% { opacity:1; transform:scale(1)  translateY(0); }
}

/* 正解エフェクト */
.correct-burst {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 18vmin;
  height: 18vmin;
  min-width: 120px;
  min-height: 120px;
  border-radius: 50%;
  border: 3px solid rgba(232, 201, 122, 0.85);
  box-shadow: 0 0 0 0 rgba(232, 201, 122, 0.35);
  transform: translate(-50%, -50%) scale(0.5);
  pointer-events: none;
  z-index: 30;
  animation: burstRing .6s ease-out forwards;
}

.correct-label {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(1rem, 2.2vw, 1.8rem);
  color: var(--gold2);
  text-shadow: 0 0 14px rgba(232, 201, 122, 0.55);
  letter-spacing: .14em;
  font-weight: bold;
  pointer-events: none;
  z-index: 31;
  animation: burstText .75s ease-out forwards;
}

.taken-burst {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 18vmin;
  height: 18vmin;
  min-width: 120px;
  min-height: 120px;
  border-radius: 50%;
  border: 3px solid rgba(224, 96, 96, 0.9);
  box-shadow: 0 0 0 0 rgba(224, 96, 96, 0.35);
  transform: translate(-50%, -50%) scale(0.5);
  pointer-events: none;
  z-index: 30;
  animation: burstRingTaken .62s ease-out forwards;
}

.taken-label {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(1rem, 2.1vw, 1.7rem);
  color: #f2aaaa;
  text-shadow: 0 0 14px rgba(224, 96, 96, 0.55);
  letter-spacing: .1em;
  font-weight: bold;
  pointer-events: none;
  z-index: 31;
  animation: burstTextTaken .75s ease-out forwards;
}

@keyframes burstRing {
  0%   { opacity: 0.95; transform: translate(-50%, -50%) scale(0.5); }
  100% { opacity: 0;    transform: translate(-50%, -50%) scale(1.45); box-shadow: 0 0 0 28px rgba(232, 201, 122, 0); }
}

@keyframes burstText {
  0%   { opacity: 0; transform: translate(-50%, -30%) scale(0.9); }
  20%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -110%) scale(1.08); }
}

@keyframes burstRingTaken {
  0%   { opacity: 0.95; transform: translate(-50%, -50%) scale(0.5); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.45); box-shadow: 0 0 0 28px rgba(224, 96, 96, 0); }
}

@keyframes burstTextTaken {
  0%   { opacity: 0; transform: translate(-50%, -30%) scale(0.9); }
  20%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -110%) scale(1.08); }
}

/* 読み上げインジケータ */
.reading-dot {
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--gold2); margin-right:6px; vertical-align:middle;
  animation:blink .7s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

/* ===== 結果画面 ===== */
#result-screen {
  background: radial-gradient(ellipse at center,#2d1e08,#0d0904);
  gap: 24px;
}
.result-title {
  font-size: clamp(1.4rem,4vw,2.4rem);
  color: var(--gold2); letter-spacing: .2em;
  text-shadow: 0 0 18px rgba(201,168,76,.5);
}
.result-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-width: 260px;
}
.stat-card {
  background: rgba(255,255,255,.06);
  border: 1px solid var(--gold); border-radius: 10px;
  padding: 14px; text-align: center;
}
.stat-card .s-lbl { font-size: .82rem; color: var(--gold); display: block; margin-bottom: 4px; }
.stat-card .s-val { font-size: 2rem; color: var(--gold2); font-weight: bold; }
.result-btns { display: flex; gap: 14px; margin-top: 6px; }
.result-btns button {
  background: transparent; border: 1px solid var(--gold); border-radius: 8px;
  color: var(--gold); font-size: 1rem; font-family: inherit;
  padding: 11px 28px; cursor: pointer; letter-spacing: .1em; transition: var(--tr);
}
.result-btns button:hover { background: var(--gold); color: var(--bg); }
</style>
</head>
<body>

<!-- ===== タイトル画面 ===== -->
<div id="title-screen" class="screen">
  <div class="title-logo">
    <div class="main">百人一首</div>
    <div class="sub">練習ゲーム</div>
  </div>

  <div class="settings-box">
    <div class="setting-row">
      <span class="setting-label">練習首数</span>
      <div class="setting-control">
        <input type="range" id="count-slider" min="5" max="100" step="5" value="100">
        <span class="setting-value" id="count-disp">100 首</span>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-label">横に並べる枚数</span>
      <div class="setting-control">
        <input type="range" id="cards-slider" min="5" max="17" step="1" value="10">
        <span class="setting-value" id="cards-disp">10 列</span>
      </div>
    </div>

    <hr class="divider">

    <div class="setting-row">
      <span class="setting-label">対戦相手</span>
      <button id="opp-toggle" class="toggle-btn">なし</button>
    </div>

    <div class="setting-row" id="speed-row" style="display:none">
      <span class="setting-label">敵の取る速さ (秒)</span>
      <div class="setting-control">
        <input type="range" id="speed-slider" min="2" max="30" step="1" value="8">
        <span class="setting-value" id="speed-disp">8 秒</span>
      </div>
    </div>

    <hr class="divider">

    <button id="start-btn" class="start-btn">はじめる</button>
  </div>
</div>

<!-- ===== ローディング画面 ===== -->
<div id="loading-screen" class="screen hidden">
  <div class="loading-title">音声を読み込んでいます</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
  <div class="loading-status" id="loading-status">準備中...</div>
</div>

<!-- ===== ゲーム画面 ===== -->
<div id="game-screen" class="screen hidden">

  <div class="hud">
    <div class="progress-info">
      <span class="progress-label">進捗</span>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="prog-bar"></div>
      </div>
      <span class="progress-count" id="prog-count">0 / 0</span>
    </div>
    <div class="score-info">
      <div class="score-item">
        <span class="lbl">正解</span><span class="val" id="sc-ok">0</span>
      </div>
      <div class="score-item">
        <span class="lbl">ミス</span><span class="val" id="sc-miss">0</span>
      </div>
      <div class="score-item" id="sc-taken-box" style="display:none">
        <span class="lbl">取られ</span><span class="val" id="sc-taken">0</span>
      </div>
    </div>
    <div class="opp-timer-wrap" id="opp-hud" style="display:none">
      <span class="opp-label">敵▶</span>
      <div class="opp-bar-wrap"><div class="opp-bar" id="opp-bar"></div></div>
    </div>
  </div>

  <div class="kami-area">
    <div class="kami-text" id="kami-text">—</div>
    <div class="kami-state" id="kami-state">準備中</div>
  </div>

  <div class="card-area" id="card-area">
    <div class="card-grid" id="card-grid"></div>
  </div>
</div>

<!-- ===== 結果画面 ===== -->
<div id="result-screen" class="screen hidden">
  <div class="result-title">結果発表</div>
  <div class="result-stats">
    <div class="stat-card">
      <span class="s-lbl">練習した首</span>
      <span class="s-val" id="r-total">0</span>
    </div>
    <div class="stat-card">
      <span class="s-lbl">正解</span>
      <span class="s-val" id="r-ok">0</span>
    </div>
    <div class="stat-card">
      <span class="s-lbl">ミス</span>
      <span class="s-val" id="r-miss">0</span>
    </div>
    <div class="stat-card" id="r-taken-card" style="display:none">
      <span class="s-lbl">取られ</span>
      <span class="s-val" id="r-taken">0</span>
    </div>
  </div>
  <div class="result-btns">
    <button id="retry-btn">もう一度</button>
    <button id="home-btn">タイトルへ</button>
  </div>
</div>

<script>
'use strict';

// ============================================================
//  グローバル変数
// ============================================================
let POEMS = [];           // poems.json から読み込んだ全100首
let audioCtx = null;
const audioCache = new Map();  // poem.id -> AudioBuffer

// ゲーム設定
const cfg = {
  count:        100,
  columns:      10,
  useOpponent:  false,
  opponentSec:  8,
};

// ゲーム状態
const st = {
  playQueue:      [],    // 再生順の poem.id 配列 (shuffled)
  currentPoemId:  null,  // 現在出題中の poem.id
  displayedCards: [],    // 固定長スロット配列 (poem or null)
  answeredIds:    new Set(),
  batchCorrect:   0,     // 現バッチの正解数 (5でリセット)
  scoreOk:    0,
  scoreMiss:  0,
  scoreTaken: 0,
  canAnswer:  false,
  rafId:      null,
  oppStartTime: null,
  oppDuration:  0,
};

// ============================================================
//  ユーティリティ
// ============================================================
const $ = id => document.getElementById(id);

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setScreen(name) {
  ['title-screen','loading-screen','game-screen','result-screen'].forEach(id => {
    $(id).classList.toggle('hidden', id !== name);
  });
}

function getPoemById(id) {
  return POEMS.find(p => p.id === id);
}

// ============================================================
//  音声関連
// ============================================================
function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

async function loadAudioFile(id) {
  if (audioCache.has(id)) return true;
  const ctx = ensureAudioCtx();

  const paddedId = String(id).padStart(3, '0');
  try {
    const res = await fetch(`audio_mp3/a${paddedId}.mp3`);
    if (!res.ok) return false;
    const buf = await ctx.decodeAudioData(await res.arrayBuffer());
    audioCache.set(id, buf);
    return true;
  } catch (_) {}

  return false;  // 音声ファイルなし (それでもゲームは動く)
}

async function loadAudioBatch(ids) {
  const bar    = $('loading-bar');
  const status = $('loading-status');
  let done = 0;

  const update = () => {
    const pct = ids.length > 0 ? done / ids.length * 100 : 100;
    bar.style.width = pct + '%';
    status.textContent = `${done} / ${ids.length} 首`;
  };
  update();

  // 最大 6 並列
  const CONC = 6;
  let idx = 0;
  const worker = async () => {
    while (idx < ids.length) {
      const id = ids[idx++];
      await loadAudioFile(id);
      done++;
      update();
    }
  };
  await Promise.all(Array.from({ length: Math.min(CONC, ids.length) }, worker));
}

let currentSource = null;

function playAudio(id, onEnded) {
  if (currentSource) { try { currentSource.stop(); } catch (_) {} }
  const buf = audioCache.get(id);
  if (!buf) { onEnded && onEnded(); return; }

  const ctx = ensureAudioCtx();
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.onended = () => { currentSource = null; onEnded && onEnded(); };
  src.start(0);
  currentSource = src;
}

function stopCurrentAudio() {
  if (!currentSource) return;
  try {
    currentSource.onended = null;
    currentSource.stop();
  } catch (_) {}
  currentSource = null;
}

function showCorrectEffect(targetEl = null) {
  const root = $('game-screen');
  if (!root) return;

  const ring = document.createElement('div');
  ring.className = 'correct-burst';
  const label = document.createElement('div');
  label.className = 'correct-label';
  label.textContent = '正解!';

  if (targetEl) {
    const rootRect = root.getBoundingClientRect();
    const rect = targetEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2 - rootRect.left;
    const cy = rect.top + rect.height / 2 - rootRect.top;
    ring.style.left = `${cx}px`;
    ring.style.top = `${cy}px`;
    label.style.left = `${cx}px`;
    label.style.top = `${cy}px`;
  }

  root.appendChild(ring);
  root.appendChild(label);

  ring.addEventListener('animationend', () => ring.remove(), { once: true });
  label.addEventListener('animationend', () => label.remove(), { once: true });
}

function showTakenEffect(targetEl = null) {
  const root = $('game-screen');
  if (!root) return;

  const ring = document.createElement('div');
  ring.className = 'taken-burst';
  const label = document.createElement('div');
  label.className = 'taken-label';
  label.textContent = '取られた!';

  if (targetEl) {
    const rootRect = root.getBoundingClientRect();
    const rect = targetEl.getBoundingClientRect();
    const cx = rect.left + rect.width / 2 - rootRect.left;
    const cy = rect.top + rect.height / 2 - rootRect.top;
    ring.style.left = `${cx}px`;
    ring.style.top = `${cy}px`;
    label.style.left = `${cx}px`;
    label.style.top = `${cy}px`;
  }

  root.appendChild(ring);
  root.appendChild(label);

  ring.addEventListener('animationend', () => ring.remove(), { once: true });
  label.addEventListener('animationend', () => label.remove(), { once: true });
}

// ============================================================
//  カードグリッドレイアウト計算
// ============================================================
function calcColumns(n) {
  const area = $('card-area');
  const W = area.clientWidth - 12;
  const GAP = 5;
  const MIN_W = 20;
  const requested = Math.max(1, Math.floor(cfg.columns || 1));
  const maxColsByWidth = Math.max(1, Math.floor((W + GAP) / (MIN_W + GAP)));
  const maxByN = Math.max(1, n);
  return Math.min(requested, maxColsByWidth, maxByN);
}

function getLayoutSpec() {
  const area = $('card-area');
  const W = Math.max(0, area.clientWidth - 12);
  const H = Math.max(0, area.clientHeight - 12);
  const GAP = 5;
  const CARD_H_PER_W = 1.35;

  const cols = calcColumns(Math.max(1, cfg.columns));
  const maxCardWByWidth = Math.floor((W - GAP * (cols - 1)) / cols);
  const maxCardWByHeight = Math.floor(H / CARD_H_PER_W);
  const cardW = Math.max(1, Math.min(maxCardWByWidth, maxCardWByHeight));
  const cardH = Math.max(1, Math.floor(cardW * CARD_H_PER_W));
  const rows = Math.max(1, Math.floor((H + GAP) / (cardH + GAP)));
  const slots = Math.max(1, cols * rows);

  return { cols, rows, slots, cardW, cardH, gap: GAP };
}

function syncDisplayedSlotsToLayout() {
  const { slots } = getLayoutSpec();
  if (st.displayedCards.length > slots) {
    st.displayedCards.length = slots;
  } else {
    while (st.displayedCards.length < slots) {
      st.displayedCards.push(null);
    }
  }
}

// ============================================================
//  カード描画
// ============================================================
function renderCards() {
  const grid = $('card-grid');
  syncDisplayedSlotsToLayout();
  const { cols, slots, cardW, cardH, gap } = getLayoutSpec();
  const slotCount = slots;

  // Tune typography from actual card size.
  const fontSizePx = Math.max(14, Math.min(26, Math.round(cardW * 0.16)));
  const topMarginPx = Math.max(2, Math.min(14, Math.round(cardW * 0.07)));
  const letterSpacingEm = Math.max(0.08, Math.min(0.2, cardW / 1000));

  grid.style.setProperty('--card-font-size', `${fontSizePx}px`);
  grid.style.setProperty('--card-text-top-margin', `${topMarginPx}px`);
  grid.style.setProperty('--card-letter-spacing', `${letterSpacingEm.toFixed(3)}em`);
  grid.style.setProperty('--card-line-height', '1.62');

  grid.style.gap = `${gap}px`;
  grid.style.gridTemplateColumns = `repeat(${cols}, ${cardW}px)`;
  grid.style.gridAutoRows = `${cardH}px`;

  // Keep slot DOM stable so existing cards don't re-animate or appear to move.
  const existingSlots = [...grid.querySelectorAll('.card-slot')];
  if (existingSlots.length < slotCount) {
    for (let i = existingSlots.length; i < slotCount; i++) {
      const slotEl = document.createElement('div');
      slotEl.className = 'card-slot';
      slotEl.dataset.slot = String(i);
      grid.appendChild(slotEl);
    }
  } else if (existingSlots.length > slotCount) {
    for (let i = existingSlots.length - 1; i >= slotCount; i--) {
      existingSlots[i].remove();
    }
  }

  for (let i = 0; i < slotCount; i++) {
    const slotEl = grid.querySelector(`.card-slot[data-slot="${i}"]`);
    if (!slotEl) continue;

    const poem = st.displayedCards[i] || null;
    const currentCard = slotEl.querySelector('.card');

    if (poem) {
      const currentId = currentCard ? +currentCard.dataset.id : null;
      if (currentId === poem.id) {
        // Keep existing card in place, no animation.
      } else {
        slotEl.innerHTML = '';
        const isNewInsert = currentCard == null;
        slotEl.appendChild(createCardEl(poem, isNewInsert));
      }
    } else {
      if (!slotEl.querySelector('.card-blank')) {
        slotEl.innerHTML = '';
        const blank = document.createElement('div');
        blank.className = 'card-blank';
        blank.setAttribute('aria-hidden', 'true');
        slotEl.appendChild(blank);
      }
    }
  }
}

function createCardEl(poem, withAppear = false) {
  const card = document.createElement('div');
  card.className = withAppear ? 'card appear' : 'card';
  card.dataset.id = poem.id;
  const text = poem.lower_kana || poem.lower;
  const textEl = document.createElement('div');
  textEl.className = 'card-text';
  textEl.textContent = text;
  card.appendChild(textEl);
  card.addEventListener('click', () => handleCardClick(poem.id));
  return card;
}

// ============================================================
//  カード補充ロジック
// ============================================================
function fillCards() {
  // セッション対象の未回答から初期カードを表示
  const { slots } = getLayoutSpec();
  const target = Math.max(1, slots);
  const pool = shuffle(
    st.playQueue
      .filter(id => !st.answeredIds.has(id))
      .map(getPoemById)
      .filter(Boolean)
  );
  const picked = pool.slice(0, target);
  st.displayedCards = [...picked];
  while (st.displayedCards.length < target) {
    st.displayedCards.push(null);
  }
}

function replenishCards(force = false) {
  syncDisplayedSlotsToLayout();
  const target = st.displayedCards.length;
  const threshold = Math.max(1, Math.ceil(target / 2));
  const activeCount = st.displayedCards.filter(Boolean).length;
  if (!force && activeCount > threshold) return;

  const displayedSet = new Set(st.displayedCards.filter(Boolean).map(p => p.id));
  const pool = shuffle(
    st.playQueue
      .filter(id => !st.answeredIds.has(id) && !displayedSet.has(id))
      .map(getPoemById)
      .filter(Boolean)
  );

  for (let i = 0; i < st.displayedCards.length && pool.length > 0; i++) {
    if (!st.displayedCards[i]) {
      st.displayedCards[i] = pool.pop();
    }
  }
}

function pickNextPoemIdFromDisplayed() {
  const candidates = st.displayedCards
    .filter(Boolean)
    .map(p => p.id)
    .filter(id => !st.answeredIds.has(id));
  if (candidates.length === 0) return null;
  return candidates[(Math.random() * candidates.length) | 0];
}

// ============================================================
//  HUD 更新
// ============================================================
function updateHUD() {
  const done = st.scoreOk + st.scoreTaken;
  const pct  = cfg.count > 0 ? done / cfg.count * 100 : 0;
  $('prog-bar').style.width   = pct + '%';
  $('prog-count').textContent = `${done} / ${cfg.count}`;
  $('sc-ok').textContent      = st.scoreOk;
  $('sc-miss').textContent    = st.scoreMiss;
  $('sc-taken').textContent   = st.scoreTaken;
}

// ============================================================
//  対戦相手タイマー
// ============================================================
function startOppTimer() {
  if (!cfg.useOpponent) return;
  const jitter   = cfg.opponentSec * 0.3;
  st.oppDuration  = (cfg.opponentSec + (Math.random() * 2 - 1) * jitter) * 1000;
  st.oppStartTime = performance.now();
  tickOppBar();
}

function stopOppTimer() {
  if (st.rafId) cancelAnimationFrame(st.rafId);
  st.rafId = st.oppStartTime = null;
  $('opp-bar').style.width = '100%';
}

function tickOppBar() {
  if (!st.oppStartTime) return;
  const remaining = 1 - (performance.now() - st.oppStartTime) / st.oppDuration;
  if (remaining <= 0) { opponentTake(); return; }
  $('opp-bar').style.width = (remaining * 100) + '%';
  st.rafId = requestAnimationFrame(tickOppBar);
}

function opponentTake() {
  if (!st.canAnswer) return;
  st.canAnswer = false;
  const currentId = st.currentPoemId;
  if (currentId == null) return;
  const cardEl    = $('card-grid').querySelector(`[data-id="${currentId}"]`);

  stopCurrentAudio();
  stopOppTimer();
  st.scoreTaken++;
  updateHUD();
  $('kami-state').textContent = '敵に取られました…';
  $('kami-text').textContent = '—';
  showTakenEffect(cardEl);

  const proceed = () => {
    st.answeredIds.add(currentId);
    const idx = st.displayedCards.findIndex(p => p && p.id === currentId);
    if (idx >= 0) st.displayedCards[idx] = null;
    setTimeout(goNextPoem, 600);
  };

  if (cardEl) {
    cardEl.classList.add('taken');
    let done = false;
    const finishOnce = () => {
      if (done) return;
      done = true;
      cardEl.remove();
      proceed();
    };
    cardEl.addEventListener('animationend', finishOnce, { once: true });
    setTimeout(finishOnce, 700);
  } else {
    proceed();
  }
}

// ============================================================
//  カードクリック処理
// ============================================================
function handleCardClick(clickedId) {
  if (!st.canAnswer) return;
  const currentId = st.currentPoemId;
  if (currentId == null) return;

  if (clickedId === currentId) {
    // ===== 正解 =====
    const cardEl = $('card-grid').querySelector(`[data-id="${clickedId}"]`);

    st.canAnswer = false;
    stopCurrentAudio();
    stopOppTimer();
    st.scoreOk++;
    st.batchCorrect++;
    updateHUD();
    showCorrectEffect(cardEl);

    let progressed = false;
    const proceedOnce = () => {
      if (progressed) return;
      progressed = true;

      st.answeredIds.add(clickedId);
      const idx = st.displayedCards.findIndex(p => p && p.id === clickedId);
      if (idx >= 0) st.displayedCards[idx] = null;

      replenishCards();

      renderCards();
      setTimeout(goNextPoem, 250);
    };

    if (cardEl) {
      cardEl.classList.add('correct');
      cardEl.addEventListener('animationend', proceedOnce, { once: true });
      // Fallback: animationend may not fire in some environments.
      setTimeout(proceedOnce, 700);
    } else {
      proceedOnce();
    }

  } else {
    // ===== 不正解 =====
    st.scoreMiss++;
    updateHUD();
    const cardEl = $('card-grid').querySelector(`[data-id="${clickedId}"]`);
    if (cardEl) {
      cardEl.classList.add('wrong');
      cardEl.addEventListener('animationend', () => cardEl.classList.remove('wrong'), { once: true });
    }
  }
}

// ============================================================
//  ゲームフロー
// ============================================================
function goNextPoem() {
  if (st.answeredIds.size >= st.playQueue.length) {
    showResult();
    return;
  }

  replenishCards();

  let nextId = pickNextPoemIdFromDisplayed();
  if (nextId == null) {
    // 念のため強制補充して再抽選
    replenishCards(true);
    nextId = pickNextPoemIdFromDisplayed();
  }
  if (nextId == null) {
    showResult();
    return;
  }

  st.currentPoemId = nextId;
  renderCards();
  requestAnimationFrame(() => renderCards());

  setTimeout(playCurrentPoem, 200);
}

function playCurrentPoem() {
  const poem = getPoemById(st.currentPoemId);
  if (!poem) return;
  $('kami-text').innerHTML = `<span class="reading-dot"></span>${poem.upper}`;
  $('kami-state').textContent = '読み上げ中…（回答できます）';
  st.canAnswer = true;
  startOppTimer();

  playAudio(poem.id, () => {
    // 再生終了後も回答可能状態は維持する
    if (st.canAnswer) {
      $('kami-state').textContent = '札を選んでください';
    }
  });
}

function startGame() {
  // 状態リセット
  st.playQueue     = shuffle(POEMS.map(p => p.id)).slice(0, cfg.count);
  st.currentPoemId = null;
  st.answeredIds   = new Set();
  st.batchCorrect  = 0;
  st.scoreOk       = 0;
  st.scoreMiss     = 0;
  st.scoreTaken    = 0;
  st.canAnswer     = false;
  stopOppTimer();
  if (currentSource) { try { currentSource.stop(); } catch (_) {} }

  // HUD の対戦相手列
  $('opp-hud').style.display      = cfg.useOpponent ? 'flex'   : 'none';
  $('sc-taken-box').style.display = cfg.useOpponent ? 'block'  : 'none';
  updateHUD();

  // カード初期化
  $('card-grid').innerHTML = '';
  st.displayedCards = [];
  fillCards();
  renderCards();
  requestAnimationFrame(() => renderCards());

  // 最初の歌を再生
  goNextPoem();
}

function showResult() {
  $('r-total').textContent = st.scoreOk + st.scoreTaken;
  $('r-ok').textContent    = st.scoreOk;
  $('r-miss').textContent  = st.scoreMiss;
  $('r-taken').textContent = st.scoreTaken;
  $('r-taken-card').style.display = cfg.useOpponent ? 'block' : 'none';
  setScreen('result-screen');
}

// ============================================================
//  タイトル画面 UI
// ============================================================
function initUI() {
  const countSlider = $('count-slider');
  const cardsSlider = $('cards-slider');
  const speedSlider = $('speed-slider');
  const oppToggle   = $('opp-toggle');

  countSlider.addEventListener('input', () => {
    cfg.count = +countSlider.value;
    $('count-disp').textContent = `${cfg.count} 首`;
  });
  cardsSlider.addEventListener('input', () => {
    cfg.columns = +cardsSlider.value;
    $('cards-disp').textContent = `${cfg.columns} 列`;
  });
  speedSlider.addEventListener('input', () => {
    cfg.opponentSec = +speedSlider.value;
    $('speed-disp').textContent = `${cfg.opponentSec} 秒`;
  });
  oppToggle.addEventListener('click', () => {
    cfg.useOpponent = !cfg.useOpponent;
    oppToggle.textContent = cfg.useOpponent ? 'あり' : 'なし';
    oppToggle.classList.toggle('on', cfg.useOpponent);
    $('speed-row').style.display = cfg.useOpponent ? 'flex' : 'none';
  });

  $('start-btn').addEventListener('click', async () => {
    const btn = $('start-btn');
    btn.disabled = true;
    ensureAudioCtx(); // ユーザーインタラクションで AudioContext を作成

    // 再生予定 ID を決定 (ここで shuffle して playQueue 仮確定)
    const tempQueue = shuffle(POEMS.map(p => p.id)).slice(0, cfg.count);

    setScreen('loading-screen');
    await loadAudioBatch(tempQueue);
    setScreen('game-screen');
    startGame();
    btn.disabled = false;
  });

  $('retry-btn').addEventListener('click', () => {
    setScreen('loading-screen');
    // 前回と同じ設定で再スタート
    const tempQueue = shuffle(POEMS.map(p => p.id)).slice(0, cfg.count);
    loadAudioBatch(tempQueue).then(() => {
      setScreen('game-screen');
      startGame();
    });
  });

  $('home-btn').addEventListener('click', () => {
    setScreen('title-screen');
    $('start-btn').disabled = false;
  });

  window.addEventListener('resize', () => {
    if (!$('game-screen').classList.contains('hidden')) {
      renderCards();
    }
  });
}

// ============================================================
//  エントリポイント
// ============================================================
async function init() {
  try {
    const res = await fetch('poems.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    POEMS = await res.json();
  } catch (e) {
    alert(
      'poems.json の読み込みに失敗しました。\n\n' +
      'ローカルサーバー経由で開いてください:\n' +
      '  python -m http.server 8000\n' +
      '  → http://localhost:8000/'
    );
    return;
  }

  initUI();
  setScreen('title-screen');
}

init();
</script>
